<!doctype html>
<html lang="zh-Hant" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>台股收益帳本｜TW Invest Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var raw = localStorage.getItem('tw-invest-ledger:display-prefs:v1');
        var parsed = raw ? JSON.parse(raw) : {};
        var scale =
          parsed.scale === 'large' || parsed.scale === 'xlarge' ? parsed.scale : 'normal';
        var theme = parsed.theme === 'light' ? 'light' : 'dark';
        var highContrast = parsed.highContrast === true;
        var root = document.documentElement;
        root.dataset.readingScale = scale;
        root.dataset.theme = theme;
        root.dataset.highContrast = highContrast ? 'true' : 'false';
        root.classList.toggle('dark', theme === 'dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', theme === 'light' ? '#F7F4EE' : '#020617');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#020617] text-slate-50 antialiased selection:bg-sky-500/30 selection:text-sky-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
